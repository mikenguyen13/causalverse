# Without url:, pkgdown writes relative <loc> values into sitemap.xml, which the
# sitemap protocol rejects (it requires fully-qualified URLs) - so Google ignored
# every entry. Setting it also makes pkgdown emit canonical link tags.
url: https://mikenguyen13.github.io/causalverse

template:
  package: pkgdown
  favicon: favicon.ico
  bootstrap: 5
  bslib:
    pkgdown-nav-height: 100px
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-GLJZT4LT1W"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-GLJZT4LT1W');
      </script>
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "causalverse",
        "alternateName": "The All-in-One Causal Inference Toolkit",
        "description": "An R package covering the full causal inference pipeline: randomized experiments, quasi-experimental designs (DiD, synthetic control, RD, IV), heterogeneous treatment effects, mediation, sensitivity analysis, and publication-ready reporting.",
        "url": "https://mikenguyen13.github.io/causalverse/",
        "codeRepository": "https://github.com/mikenguyen13/causalverse",
        "programmingLanguage": {"@type": "ComputerLanguage", "name": "R"},
        "runtimePlatform": "R",
        "version": "1.1.0",
        "license": "https://www.gnu.org/licenses/gpl-3.0",
        "image": "https://mikenguyen13.github.io/causalverse/logo.png",
        "author": {
          "@type": "Person",
          "name": "Mike Nguyen",
          "identifier": "https://orcid.org/0000-0002-3432-8595",
          "url": "https://mikenguyen.netlify.app/"
        }
      }
      </script>
      <!-- cv-exp:head -->
      <meta name="citation_title" content="causalverse: The All-in-One Causal Inference Toolkit">
      <meta name="citation_author" content="Nguyen, Mike">
      <meta name="citation_publication_date" content="2026">
      <meta name="citation_publisher" content="Zenodo">
      <meta name="citation_doi" content="10.5281/zenodo.8254063">
      <style>
      .cv-box{font-size:.9em;border:1px solid var(--bs-border-color,#dee2e6);border-radius:6px;padding:.75em 1em;margin:1.5em 0 0}
      .cv-box h2,.contents .cv-box h2{font-size:1.15em;font-weight:600;margin:0 0 .5em;padding-top:0}
      .cv-box p,.cv-box ul{margin-bottom:.5em}
      .cv-box ul{padding-left:1.2em}
      .cv-box a{overflow-wrap:anywhere}
      .cv-box pre{font-size:.9em;margin-bottom:.5em;white-space:pre-wrap;overflow-wrap:anywhere}
      .cv-box details summary{cursor:pointer}
      .cv-box .cv-install img{height:20px;margin:0 .25rem .25rem 0}
      aside .cv-box{margin-top:0}
      </style>
      <!-- /cv-exp:head -->

# Pages here are post-processed after every pkgdown build: run
#   Rscript pkgdown/postbuild.R
# It adds what pkgdown templates cannot (a canonical link per page, the "Related in
# other books", "Cite this section" and AI-assistant boxes at the end of each
# vignette) and copies the block between the cv-exp:head markers above into pages
# that were not rebuilt. See pkgdown/postbuild.R.

home:
  sidebar:
    structure: [ai, links, license, community, citation, authors, dev]
    components:
