# Daily check of journal author guidelines for table/figure formatting changes.
# Fetches every page in inst/extdata/journal_sources.csv, compares it with the
# snapshot in tools/monitor/snapshots/, and opens (or updates) a pull request
# with the diffs when anything changed. Review the PR and, if a formatting rule
# changed, update R/journal_styles_data.R (and bump .jstyle_verified) before
# merging. Pages that cannot be reached at all are tracked in one issue.
name: journal-guidelines

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated journal ids to check (blank = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: journal-guidelines
  cancel-in-progress: false

jobs:
  monitor:
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for pdftools
        run: sudo apt-get update && sudo apt-get install -y libpoppler-cpp-dev

      - name: Install R packages
        run: Rscript -e 'install.packages(c("curl", "xml2", "pdftools"))'

      - name: Check guideline pages
        id: monitor
        run: |
          Rscript tools/monitor/check_guidelines.R \
            --report "${{ runner.temp }}/guideline-report.md" \
            --unreachable "${{ runner.temp }}/unreachable.md" \
            --only "${{ github.event.inputs.only }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guideline-report
          path: ${{ runner.temp }}/*.md

      - name: Open pull request with changed snapshots
        if: steps.monitor.outputs.changed != '0' || steps.monitor.outputs.new != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/journal-guidelines
          add-paths: tools/monitor/**
          commit-message: Update journal guideline snapshots
          title: Journal guideline pages changed
          body-path: ${{ runner.temp }}/guideline-report.md
          labels: journal-guidelines
          delete-branch: true

      - name: Track pages that need manual review
        if: steps.monitor.outputs.unreachable != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create journal-guidelines-manual --color FBCA04 \
            --description "Guideline pages the monitor cannot reach" 2>/dev/null || true
          num=$(gh issue list --label journal-guidelines-manual --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file "${{ runner.temp }}/unreachable.md"
          else
            gh issue create --title "Journal guideline pages that need manual review" \
              --label journal-guidelines-manual --body-file "${{ runner.temp }}/unreachable.md"
          fi
