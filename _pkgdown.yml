          <p>Ask questions about this package in Claude, Cursor, VS Code, or ChatGPT, with answers that cite the section.</p>
          <div class="sourceCode"><pre><code>https://research-methods-mcp.vercel.app/mcp?src=book-causalverse</code></pre></div>
          <p class="cv-install"><a href="https://cursor.com/en/install-mcp?name=research-methods&amp;config=eyJ1cmwiOiJodHRwczovL3Jlc2VhcmNoLW1ldGhvZHMtbWNwLnZlcmNlbC5hcHAvbWNwP3NyYz1ib29rLWNhdXNhbHZlcnNlIn0%3D"><img src="https://cursor.com/deeplink/mcp-install-dark.svg" alt="Add to Cursor"></a><a href="https://insiders.vscode.dev/redirect/mcp/install?name=research-methods&amp;config=%7B%22type%22%3A%22http%22%2C%22url%22%3A%22https%3A%2F%2Fresearch-methods-mcp.vercel.app%2Fmcp%3Fsrc%3Dbook-causalverse%22%7D"><img src="https://img.shields.io/badge/VS_Code-Install_server-0098FF?logo=visualstudiocode&amp;logoColor=white" alt="Install in VS Code"></a></p>
          <p><a href="https://research-methods-mcp.vercel.app/">Setup for other clients</a></p>
          </div>

